name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 22.13.0 is the documented minimum (first release with unflagged
        # node:sqlite); 24 matches the production Docker image.
        node: ['22.13.0', '24']
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: SQLite persistence tests
        run: npm run smoke:store

      - name: Server smoke tests
        env:
          NODE_ENV: production
          PORT: 8787
          SQLITE_PATH: ':memory:'
          MODERATION_TOKEN: ci-moderation-token-0123456789abcdef
          DEMO_WAIT_SECONDS: 2
        run: |
          node server/index.js &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 40); do
            if curl -fsS http://localhost:8787/api/health > /dev/null; then
              break
            fi
            sleep 0.5
          done
          curl -fsS http://localhost:8787/api/health

          npm run smoke:server

          # The production app and moderation dashboard must stay protected.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/moderation)" = "401"
          curl -sI http://localhost:8787/ | grep -qi '^content-security-policy:'

          # Runtime client config (TURN) must be served as JSON.
          curl -fsS http://localhost:8787/api/config | grep -q '"turn"'

          COOKIE_JAR="$(mktemp)"
          test "$(curl -s -o /dev/null -w '%{http_code}' -c "$COOKIE_JAR" -X POST \
            -d "token=$MODERATION_TOKEN" http://localhost:8787/moderation/login)" = "303"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$COOKIE_JAR" \
            http://localhost:8787/moderation)" = "200"
          rm -f "$COOKIE_JAR"
          echo "Moderation auth and security headers passed."

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT" >&2
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Build debug APK
        env:
          # Placeholder backend: CI only proves the native build still works.
          VITE_API_ORIGIN: https://ci.invalid
        run: npm run android:apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: riplika-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
